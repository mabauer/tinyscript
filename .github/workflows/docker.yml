name: Docker

on:
  push:
    tags: ['v*.*.*']

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Node.js runtime (frontend-maven-plugin)
        uses: actions/cache@v6
        with:
          path: de.mkbauer.tinyscript.webdemo/frontend/node
          key: node-${{ runner.os }}-v22.23.5

      - name: Build core (Tycho reactor, skip tests)
        run: ./mvnw clean install -DskipTests

      - name: Build web demo JAR (skip Java tests, Vitest still runs)
        run: ./mvnw clean package -f de.mkbauer.tinyscript.webdemo/pom.xml -DskipTests

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: de.mkbauer.tinyscript.webdemo
          pull: true
          load: true
          tags: mkbauer/tinyscript:${{ env.VERSION }}

      # Never push an image with known, fixable HIGH/CRITICAL vulnerabilities
      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mkbauer/tinyscript:${{ env.VERSION }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: de.mkbauer.tinyscript.webdemo
          push: true
          tags: |
            mkbauer/tinyscript:${{ env.VERSION }}
            mkbauer/tinyscript:latest
