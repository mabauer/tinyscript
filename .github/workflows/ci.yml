name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Cache Node.js runtime (frontend-maven-plugin)
        uses: actions/cache@v6
        with:
          path: de.mkbauer.tinyscript.webdemo/frontend/node
          key: node-${{ runner.os }}-v24.22.3

      - name: Build and test core and REPL (Tycho reactor)
        run: ./mvnw clean install

      - name: Build and test web demo
        run: ./mvnw clean package -f de.mkbauer.tinyscript.webdemo/pom.xml

      - name: Test and package the VS Code extension
        working-directory: de.mkbauer.tinyscript.vscode
        run: npm ci && npm test && npm run package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: de.mkbauer.tinyscript.webdemo
          pull: true
          load: true
          tags: tinyscript-webdemo:ci

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tinyscript-webdemo:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
